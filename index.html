<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LittleRoam — Family Weekend Planner</title>
  <meta name="description" content="Plan your family weekend in a minute: around the kids' classes, with screen-free adventures nearby in the free time. Free." />
  <meta name="theme-color" content="#2f6b4f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LittleRoam" />
  <meta property="og:title" content="LittleRoam — Family Weekend Planner" />
  <meta property="og:description" content="Your family weekend, planned around the kids' classes." />
  <meta property="og:image" content="icons/icon-512.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#weekend" class="brand" aria-label="LittleRoam home"><img src="icons/icon.svg" alt="" width="28" height="28" /> LittleRoam</a>
    <button id="settings-btn" class="icon-btn" aria-label="Family settings">⚙️</button>
  </header>

  <main>
    <div id="view" tabindex="-1"></div>
  </main>

  <nav class="tabs" aria-label="Main">
    <a class="tab" data-view="weekend" href="#weekend"><span aria-hidden="true">🗓️</span>Weekend</a>
    <a class="tab" data-view="chat" href="#chat"><span aria-hidden="true">💬</span>Chat</a>
    <a class="tab" data-view="near" href="#near"><span aria-hidden="true">📍</span>Near me</a>
    <a class="tab" data-view="ideas" href="#ideas"><span aria-hidden="true">💡</span>Ideas</a>
    <a class="tab" data-view="memories" href="#memories"><span aria-hidden="true">💛</span>Memories</a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <button class="icon-btn sheet-close" data-close aria-label="Close">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <noscript><p style="padding:16px">LittleRoam needs JavaScript to plan your adventures.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
