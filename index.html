<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LittleRoam — Family Activity Planner</title>
  <meta name="description" content="Screen-free activities, little local adventures and private family memories. Plan something meaningful with your kids in under a minute — free." />
  <meta name="theme-color" content="#2f6b4f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="LittleRoam" />
  <meta property="og:title" content="LittleRoam — Family Activity Planner" />
  <meta property="og:description" content="Screen-free ideas, near-me adventures and private memories for families." />
  <meta property="og:image" content="icons/icon-512.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <a href="#today" class="brand" aria-label="LittleRoam home"><img src="icons/icon.svg" alt="" width="28" height="28" /> LittleRoam</a>
    <button id="settings-btn" class="icon-btn" aria-label="Family settings">⚙️</button>
  </header>

  <main>
    <div id="view" tabindex="-1"></div>
  </main>

  <nav class="tabs" aria-label="Main">
    <a class="tab" data-view="today" href="#today"><span aria-hidden="true">🧭</span>Today</a>
    <a class="tab" data-view="near" href="#near"><span aria-hidden="true">📍</span>Near me</a>
    <a class="tab" data-view="ideas" href="#ideas"><span aria-hidden="true">💡</span>Ideas</a>
    <a class="tab" data-view="plan" href="#plan"><span aria-hidden="true">📅</span>Plans</a>
    <a class="tab" data-view="memories" href="#memories"><span aria-hidden="true">💛</span>Memories</a>
  </nav>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true">
      <button class="icon-btn sheet-close" data-close aria-label="Close">✕</button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <noscript><p style="padding:16px">LittleRoam needs JavaScript to plan your adventures.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
